baseURL: "https://blog.rohanbatra.in/"
title: "Rohan's Blog"
theme: PaperMod

enableRobotsTXT: true
buildDrafts: true
buildFuture: false
buildExpired: false

minify:
  disableXML: false
  minifyOutput: true

params:
  env: production
  description: "Rohan Batra's digital space: An eclectic collection of thoughts, creations, and documents of all kinds."
  keywords:
    [Blog, Portfolio, Thoughts, Creations, Documents, Writing, Ideas, Personal]
  author: "Rohan"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  mainSections: ["posts"]

  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: "Welcome to my blog"

  socialIcons:
    - name: "x"
      url: "https://x.com/rohanbatrain"
    - name: "github"
      url: "https://github.com/rohanbatrain"

  editPost:
    URL: "https://github.com/rohanbatrain/blog/tree/main/content/en"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

defaultContentLanguage: en
defaultContentLanguageInSubdir: true

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content/en"
    menu:
      main:
        - identifier: categories
          name: "Categories"
          url: /en/categories/
          weight: 10
        - identifier: search
          name: "Search"
          url: /en/search/
          weight: 10
        - identifier: tags
          name: "Tags"
          url: /en/tags/
          weight: 30
        - identifier: portfolio
          name: "Portfolio"
          url: https://rohanbatra.in/
          weight: 40
        - identifier: github
          name: "Blog"
          url: https://github.com/rohanbatrain/blog/
          weight: 50

  hi:
    languageName: "हिंदी"
    weight: 2
    contentDir: "content/hi"
    menu:
      main:
        - identifier: categories
          name: "श्रेणियाँ"
          url: /hi/categories/
          weight: 10
        - identifier: tags
          name: "टैग्स"
          url: /hi/tags/
          weight: 20
        - identifier: portfolio
          name: "पोर्टफोलियो"
          url: https://rohanbatra.in/
          weight: 30
        - identifier: github
          name: "ब्लॉग"
          url: https://github.com/rohanbatrain/blog/
          weight: 40

outputs:
  home: ["html", "rss", "json"]

pygmentsUseClasses: true

markup:
  highlight:
    noClasses: false
