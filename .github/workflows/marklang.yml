name: Run on /content/en changes

on:
  push:
    paths:
      - 'content/en/**'

jobs:
  list-changed-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: List changed files under /content/en
        id: changed-files
        run: |
          echo "Changed files:"
          git fetch origin ${{ github.event.before }}
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'content/en/**' > changed_files.txt
          cat changed_files.txt

      - name: Output file list (optional: use as output)
        run: |
          echo "Changed files:"
          while read file; do
            echo "$file"
          done < changed_files.txt
