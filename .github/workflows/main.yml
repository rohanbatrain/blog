name: Hugo Static Site Build

on:
  push:
    branches:
      - main

jobs:
  marklang:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List changed files under /content/en
        id: changed-files
        run: |
          echo "Changed files in /content/en:"
          git fetch origin ${{ github.event.before }}
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'content/en/**' > changed_files.txt
          cat changed_files.txt

  build:
    needs: marklang  # Wait for marklang job to finish
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures proper .GitInfo and .Lastmod

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build the Hugo site
        run: hugo

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
