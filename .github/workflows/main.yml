name: Hugo Static Site Build with Ollama and MarkLang

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'content/en/**'
    


jobs:
  hugo_marklang:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache pip dependencies (restore)
      - name: Restore pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key:
            ${{ runner.os }}-pip-${{ hashFiles('/tmp/marklang/requirements.txt')
            }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Restore Ollama model cache
      - name: Restore Ollama model cache
        uses: actions/cache@v3
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-llama3.2-3b
          restore-keys: |
            ${{ runner.os }}-ollama-

      # Restore Hugo cache
      - name: Restore Hugo cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/hugo
          key: ${{ runner.os }}-hugo-${{ hashFiles('config.toml') }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server and pull model
        run: |
          ollama serve &
          echo "Waiting for Ollama server to be ready..."
          sleep 15
          curl http://localhost:11434 || { echo "Ollama server did not respond!"; exit 1; }

          if ! ollama list | grep -q "llama3.2:3b"; then
            echo "Pulling llama3.2:3b model..."
            ollama pull llama3.2:3b
          else
            echo "Ollama model already present."
          fi
        env:
          OLLAMA_HOST: '0.0.0.0'
          OLLAMA_KEEP_ALIVE: 5m

      # Save Ollama model to cache (post-pull)
      - name: Save Ollama model cache
        if: always()
        uses: actions/cache@v3
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-llama3.2-3b

      - name: Download Hugo Theme
        run: git submodule update --init --recursive

      - name: Clone MarkLang
        run:
          git clone https://github.com/rohanbatrain/MarkLang.git /tmp/marklang

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MarkLang dependencies
        run: pip install -r /tmp/marklang/requirements.txt

      - name: List changed files under content/en
        id: changed-files
        run: |
          git fetch origin ${{ github.event.before }}
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'content/en/**' > changed_files.txt
          if [ ! -s changed_files.txt ]; then
            echo "No changes detected in content/en/. Skipping translation."
            exit 0
          fi
          cat changed_files.txt

      - name: Run MarkLang on changed files for all languages
        run: |
          LANGUAGES=("hi" "de" "fr" "it" "pt" "es" "th")
          for lang in "${LANGUAGES[@]}"; do
            echo "Translating files to language: $lang"
            while IFS= read -r file; do
              if [[ -f "$file" ]]; then
                echo "Translating $file"
                python /tmp/marklang/main.py "$file" "$lang"
              fi
            done < changed_files.txt
          done
          
      - name: Commit and push translated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git pull --rebase origin main  # <-- Failsafe addition
      
          git add content/
          git commit -m "Translate updated content files with MarkLang" || echo "No changes to commit"
          git push origin main

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build the Hugo site
        run: hugo

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push built site to rohan_batra/landing under blog/
        run: |
          git clone https://x-access-token:${{ secrets.GH_SECRET }}@github.com/rohanbatrain/rohan_batra.git /tmp/landing-repo
          cd /tmp/landing-repo

          git checkout landing || git checkout -b landing

          mkdir -p blog
          rm -rf blog/*
          cp -r $GITHUB_WORKSPACE/public/* blog/

          git config user.name "rohanbatrain"
          git config user.email "116573125+rohanbatrain@users.noreply.github.com"

          git add blog
          git commit -m "Update blog/ with latest Hugo build"
          git push origin landing
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SECRET }}
