name: Hugo Static Site Build with Ollama and MarkLang

on:
  push:
    branches:
      - main
    paths:
      - 'content/en/**'

jobs:
  setup-ollama:
    runs-on: ubuntu-22.04
    outputs:
      ollama-status: ${{ steps.ollama-status.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      # Removed "Start Ollama Server" step entirely

      - name: Pull llama3.2 model in Ollama
        # This step will run unconditionally now
        run: ollama pull llama3.2

  marklang:
    needs: setup-ollama
    runs-on: ubuntu-22.04
    # Removed the condition that depended on ollama-status since it's no longer set
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone MarkLang
        run: |
          git clone https://github.com/rohanbatrain/MarkLang.git /tmp/marklang

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MarkLang dependencies
        run: pip install -r /tmp/marklang/requirements.txt

      - name: List changed files under content/en
        id: changed-files
        run: |
          git fetch origin ${{ github.event.before }}
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'content/en/**' > changed_files.txt
          if [ ! -s changed_files.txt ]; then
            echo "No changes detected in content/en/. Skipping translation."
            exit 0
          fi
          cat changed_files.txt

      - name: Run MarkLang on changed files
        run: |
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              echo "Translating $file"
              python /tmp/marklang/main.py "$file" hi
            fi
          done < changed_files.txt

  build:
    needs: marklang
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build the Hugo site
        run: hugo

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
