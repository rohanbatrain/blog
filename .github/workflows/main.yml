name: Hugo Static Site Build with Ollama and MarkLang

on:
  push:
    branches:
      - main
    paths:
      - 'content/en/**'
      
jobs:
  hugo_marklang:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
  
      - name: Start Ollama server and pull model
        run: |
          ollama serve &
  
          echo "Waiting for Ollama server to be ready..."
          sleep 15 # Adjust this sleep duration if you face connection issues, especially for larger models
  
          curl http://localhost:11434 || { echo "Ollama server did not respond!"; exit 1; }
          echo "Ollama server is running."
  
          ollama pull llama3.2:3b
          echo "Model llama3 pulled."
        env:
          OLLAMA_HOST: "0.0.0.0"
          OLLAMA_KEEP_ALIVE: 5m

      - name: Clone MarkLang
        run: |
          git clone https://github.com/rohanbatrain/MarkLang.git /tmp/marklang

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MarkLang dependencies
        run: pip install -r /tmp/marklang/requirements.txt

      - name: List changed files under content/en
        id: changed-files
        run: |
          git fetch origin ${{ github.event.before }}
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'content/en/**' > changed_files.txt
          if [ ! -s changed_files.txt ]; then
            echo "No changes detected in content/en/. Skipping translation."
            exit 0
          fi
          cat changed_files.txt
          
      - name: Run MarkLang on changed files for all languages
        run: |
          LANGUAGES=("de" "fr" "it" "pt" "es" "th")
          for lang in "${LANGUAGES[@]}"; do
            echo "Translating files to language: $lang"
            while IFS= read -r file; do
              if [[ -f "$file" ]]; then
                echo "Translating $file"
                python /tmp/marklang/main.py "$file" "$lang"
              fi
            done < changed_files.txt
          done

      - name: Commit and push translated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/
          git commit -m "Translate updated content files with MarkLang" || echo "No changes to commit"
          git push origin main


      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'  # Or use a fixed version like '0.119.0'
          extended: true

      - name: Build the Hugo site
        run: hugo 

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages      # The branch the site will be deployed to
          folder: public        # The folder Hugo outputs the site to
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub token for authentication
