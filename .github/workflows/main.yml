name: Hugo Static Site Build + Markdown Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.yml'
      - '**' # rebuild Hugo on any change
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - '**/*.yaml'
      - '**/*.yml'
      - '**'

jobs:
  lint:
    name: Lint & Autofix Markdown + Frontmatter
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install linters
        run: npm install --no-save prettier markdownlint-cli2

      - name: Lint and fix Markdown and frontmatter
        run: |
          npx prettier --write "**/*.md"
          npx markdownlint-cli2 --fix "**/*.md"

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: lint markdown + frontmatter"
          branch: ${{ github.head_ref }}

  build:
    name: Build & Deploy Hugo Site
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - run: hugo

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
