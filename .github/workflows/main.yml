name: Hugo Static Site Build with Ollama and MarkLang

on:
  push:
    branches:
      - main
    paths:
      - 'content/en/**'
jobs:
  setup-ollama:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      
      - name: Start Ollama server
        run: |
          OLLAMA_HOST=0.0.0.0:1024 ollama serve &
          sleep 5


      - name: Pull llama3.2 model in Ollama
        run: ollama pull llama3.2

  marklang:
    needs: setup-ollama
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone MarkLang
        run: |
          git clone https://github.com/rohanbatrain/MarkLang.git -b actions /tmp/marklang

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MarkLang dependencies
        run: pip install -r /tmp/marklang/requirements.txt

      - name: List changed files under content/en
        id: changed-files
        run: |
          git fetch origin ${{ github.event.before }}
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'content/en/**' > changed_files.txt
          if [ ! -s changed_files.txt ]; then
            echo "No changes detected in content/en/. Skipping translation."
            exit 0
          fi
          cat changed_files.txt


      - name: Run MarkLang on changed files
        run: |
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              echo "Translating $file"
              python /tmp/marklang/main.py "$file" hi
            fi
          done < changed_files.txt
